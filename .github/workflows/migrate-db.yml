name: Migrate DB

on:
  push:
    branches: [main]
    # Cloudflare Workers Builds deploys the worker but never applies D1
    # migrations — run them on every push to main. No `paths` filter or
    # `[skip ci]` guard: a skipped run would leave production unmigrated, and
    # an up-to-date DB makes this a no-op.
  workflow_dispatch:

concurrency:
  group: migrate-db
  cancel-in-progress: false

jobs:
  migrate:
    # Manual runs from other branches must not reach production D1.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: this job holds a production D1 credential.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      # Skip prepare (pnpm build) — this job only needs wrangler to apply SQL.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Needs a token with D1:Edit on the account in wrangler.jsonc.
      - name: Apply remote D1 migrations
        run: pnpm db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 16a04bbc76ee5eccbcc1d6c39bc9a797
